<!doctype html><html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HKJC 賠率走勢監察</title>
<style>
:root{--bg:#0b1220;--card:#121c30;--line:#243453;--txt:#e8eefc;--dim:#93a7c9;--up:#ff8f7a;--dn:#8ff0c8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1220,#0d1728);color:var(--txt);
font-family:"Noto Sans TC","PingFang HK",system-ui,sans-serif;padding:26px 18px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--dim);font-size:13.5px;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
label{font-size:13px;color:var(--dim);display:block;margin-bottom:6px}
input,button{background:#0e1830;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit}
button{background:#1d3a63;cursor:pointer}button:hover{background:#26497a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid #1c2a45;text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;font-size:12.5px}
.up{color:var(--up)}.dn{color:var(--dn)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:#1a2b47;color:#bcd0f2;margin-right:6px}
.ok{background:#12341f;color:#8ff0c8}.warn{background:#3a2a12;color:#ffd76a}
.muted{color:var(--dim);font-size:12.5px}
</style></head><body><div class="wrap">
<h1>HKJC 賠率走勢監察</h1>
<div class="sub">讀取雲端收集嘅賠率快照 · 落飛／退飛偵測 · 完整性檢查</div>

<div class="panel">
  <div class="row">
    <div style="flex:1;min-width:260px">
      <label>GitHub 快照來源（owner/repo）</label>
      <input id="repo" style="width:100%" placeholder="例如 kit/hkjc-odds" value="">
    </div>
    <div><label>賽日</label><input id="date" placeholder="20261007" value=""></div>
    <div><label>獨贏彩池估算（百萬）</label><input id="pool" style="width:110px" value="10" onchange="if(SNAPS.length)renderSeries(),renderAlerts()"></div>
    <div><button onclick="loadRemote()">載入雲端快照</button></div>
    <div><label>或本機檔案</label><input type="file" id="file" onchange="loadLocal(this)"></div>
    <div><button onclick="loadDemo()">載入示範資料</button></div>
  </div>
  <div class="muted" style="margin-top:9px">資料來源：<code>data/odds_snapshots/&lt;賽日&gt;.jsonl</code>（由 GitHub Actions 每 5 分鐘自動提交）</div>
</div>

<div id="status" class="panel" style="display:none"></div>
<div id="summary" class="panel" style="display:none"></div>
<div id="moves" class="panel" style="display:none"></div>
<div id="races" class="panel" style="display:none"></div>
<div id="pools" class="panel" style="display:none"></div>
<div id="alerts" class="panel" style="display:none"></div>
<div id="slottop" class="panel" style="display:none"></div>
<div id="drops" class="panel" style="display:none"></div>
<div id="matrix" class="panel" style="display:none"></div>
<div id="pairhorse" class="panel" style="display:none"></div>
<div id="series" class="panel" style="display:none"></div>

<script>
let SNAPS=[];
// 10/07 HV 開跑時間（用嚟計開跑前 1/2/3 小時基準）
const OFFTIME={'1':'18:35','2':'19:05','3':'19:35','4':'20:10','5':'20:40','6':'21:10','7':'21:45','8':'22:15','9':'22:50'};
function parseJSONL(txt){return txt.trim().split('\n').map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean)}
async function loadDemo(){
  try{const r=await fetch('sample.jsonl'); render(parseJSONL(await r.text()),'示範資料（模擬快照）')}
  catch(e){alert('載入示範失敗')}
}
function note(html){const st=document.getElementById('status');st.style.display='block';st.innerHTML=html;
  ['summary','moves','races','series','alerts','pools','slottop','drops','matrix','pairhorse','pairseries','pairalerts'].forEach(id=>document.getElementById(id).style.display='none');}
async function loadRemote(){
  const repo=document.getElementById('repo').value.trim();
  const date=document.getElementById('date').value.trim();
  if(!repo||!date){note('<b>⚠️ 請填寫 GitHub repo 同賽日</b>');return}
  const path=`data/odds_snapshots/${date}.jsonl`;
  // 多重來源（raw 可能被擴充／防火牆阻擋）
  const bust=Date.now();
  const urls=[
    {u:`https://raw.githubusercontent.com/${repo}/main/${path}?t=${bust}`, kind:'raw', l:'GitHub raw'},
    {u:`https://hkjctrigger.kitvix.workers.dev/data/${date}.jsonl`, kind:'raw', l:'Cloudflare Worker'},
    {u:`https://api.github.com/repos/${repo}/contents/${path}?ref=main&t=${bust}`, kind:'api', l:'GitHub API'},
    {u:`https://raw.githack.com/${repo}/main/${path}?t=${bust}`, kind:'raw', l:'githack'},
    {u:`https://cdn.jsdelivr.net/gh/${repo}@main/${path}`, kind:'raw', l:'jsDelivr'},
  ];
  const tried=[];
  for(const x of urls){
    try{
      const r=await fetch(x.u,{cache:'no-store'});
      tried.push(x.l+'：HTTP '+r.status);
      if(r.ok){
        let txt;
        if(x.kind==='api'){
          const j=await r.json();
          txt=decodeURIComponent(escape(atob((j.content||'').replace(/\n/g,''))));
        } else { txt=await r.text(); }
        // 驗證：必須係真正快照（有 odds 或 runs 嘅記錄 ≥5 筆）
        let valid=false;
        if(txt && txt.trim()){
          const probe=parseJSONL(txt);
          const okRec=probe.filter(r=>r && (r.odds || r.runs));
          valid = okRec.length>=5;
          if(!valid){ tried.push(x.l+'：回應唔似快照資料（略過）'); continue; }
        }
        if(txt && txt.trim()){
          const parsed=parseJSONL(txt);
          render(parsed, x.l+' · '+repo+'/'+path);
          // 過舊警告
          try{
            const last=parsed[parsed.length-1];
            if(last&&last.hhmm){
              const d=new Date(); const nowMin=d.getHours()*60+d.getMinutes();
              const lm=Math.floor(+last.hhmm/100)*60+(+last.hhmm%100);
              const age=nowMin-lm;
              if(age>45){
                const st=document.getElementById('status');
                st.innerHTML+=`<div style="margin-top:9px;color:#ffd76a">⚠️ 此來源資料較舊（最後快照 ${last.hhmm.slice(0,2)}:${last.hhmm.slice(2)}，約 ${age} 分鐘前）—— 可能係 CDN 快取。建議改用 GitHub raw 或按「載入雲端快照」重試。</div>`;
              }
            }
          }catch(e){}
          return;
        }
      }
    }catch(e){ tried.push(x.l+'：'+e.message) }
  }
  const t=new Date().toLocaleTimeString('zh-HK');
  note(`<span class="badge" style="background:#3a1a1a;color:#ff9f92">❌ 全部來源都載入失敗</span>
    <div style="margin-top:9px;line-height:1.9">
    <b>試過嘅來源：</b><br><span class="muted" style="font-size:12.5px">${tried.join('<br>')}</span><br><br>
    <b>可能原因：</b>① 瀏覽器擴充（uBlock／AdGuard／私隱工具）阻擋 GitHub<br>
    ② 公司／學校防火牆　③ GitHub API 限流<br><br>
    <b>✅ 最快解決：用「選擇檔案」載入本機副本</b>
    <div style="margin-top:6px;padding:8px 10px;background:#0e1830;border-radius:8px;font-size:12.5px">
    檔案位置：<code>hkjc_db/data/odds_snapshots/${date}.jsonl</code><br>
    或我幫你準備嘅副本：<code>20261007_賠率快照.jsonl</code>（工作區根目錄）
    </div></div>
    <div class="muted" style="margin-top:9px">檢查時間：${t}　·　repo：${repo}</div>`);
}
function loadLocal(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>render(parseJSONL(rd.result),f.name); rd.readAsText(f,'utf-8');
}
function fmt(v){return v==null?'—':v.toFixed(1)}
function formatMoney(v){
  if(v==null) return '—';
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(2)+'M';
  if(a>=1e3) return (v/1e3).toFixed(0)+'K';
  return v.toFixed(0);
}
function render(snaps,src){
  // 清洗：賠率 ≥900（999 佔位）視為無效
  snaps.forEach(s=>{ for(const k in (s.odds||{})){ if(!(s.odds[k]>0&&s.odds[k]<900)) delete s.odds[k]; }
    if(s.runs) for(const rn in s.runs){ (s.runs[rn].runners||[]).forEach(r=>{ if(!(r.win>0&&r.win<900)) r.win=null; if(!(r.place>0&&r.place<900)) r.place=null; }); } });
  SNAPS=snaps;
  const st=document.getElementById('status'); st.style.display='block';
  if(!snaps.length){st.innerHTML='<b>冇快照資料</b>';return}
  const ms=snaps.filter(x=>x.runs&&Object.keys(x.runs).length);
  const first=ms.length?ms[0]:snaps[0], last=ms.length?ms[ms.length-1]:snaps[snaps.length-1];
  const toMin=h=>Math.floor(+h/100)*60+(+h%100);
  // 自適應缺漏偵測：用「中位間隔嘅 2.5 倍」做門檻（最少 8 分鐘）
  const diffs=[];
  for(let i=1;i<snaps.length;i++) diffs.push(toMin(snaps[i].hhmm)-toMin(snaps[i-1].hhmm));
  const sortedDiffs=[...diffs].sort((a,b)=>a-b);
  const med=sortedDiffs.length?sortedDiffs[Math.floor(sortedDiffs.length/2)]:3;
  const THR=20;   // 固定 20 分鐘（抓取節奏 5-15 分鐘；同一次執行會寫 2 張）
  const gaps=[];
  for(let i=1;i<snaps.length;i++){const d=diffs[i-1];
    if(d>THR) gaps.push(`${snaps[i-1].hhmm}→${snaps[i].hhmm}（${d}分）`)}
  st.innerHTML=`<span class="badge">快照 ${snaps.length} 張</span>
    <span class="badge">${first.hhmm} → ${last.hhmm}</span>
    <span class="badge">賽日 ${first.date||'—'} ${first.venue||''}</span>
    <span class="badge ${gaps.length?'warn':'ok'}">${gaps.length?'⚠️ 缺漏：'+gaps.join('、'):'✅ 無明顯缺漏'}</span>
    <span class="badge">間隔：中位 ${med} 分｜門檻 ${THR} 分</span>
    <div class="muted" style="margin-top:8px">來源：${src}</div>`;
  const sum=document.getElementById('summary'); sum.style.display='block';
  const rows=[];
  for(const k in first.odds){const a=first.odds[k], b=last.odds[k]; if(a>0&&a<900&&b>0&&b<900) rows.push({k,a,b,r:b/a})}
  // 已按要求取消：走勢分組
  // ── 每場落飛王（改版）：開跑前 3h / 2h / 1h vs 最新，四個彩池 ──
  const rr=document.getElementById('races'); rr.style.display='block';
  const M=multiSnaps();
  const toMin2=h=>Math.floor(+h/100)*60+(+h%100);
  const lastS=M[M.length-1];
  // 賽日（用最後快照嘅日期）
  const RACEDATE=(lastS.ts||'').slice(0,10);
  const offStamp=rn=>{const t=OFFTIME[rn]; return t?RACEDATE+'T'+t:null};   // YYYY-MM-DDTHH:MM
  const addMin=(stamp,mins)=>{ // 'YYYY-MM-DDTHH:MM' 加減分鐘
    const d=new Date(stamp.replace(' ','T')+':00'); d.setMinutes(d.getMinutes()+mins);
    const p2=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes());
  };
  const minutesApart=(a,b)=>Math.abs((new Date(a.replace(' ','T')+':00'))-(new Date(b.replace(' ','T')+':00')))/60000;
  const near=(rn,mins)=>{ // 最接近（開跑 − mins）而且係同一日、已過去嘅快照（容許 ±25 分鐘）
    const off=offStamp(rn); if(!off) return null;
    const tgt=addMin(off,-mins);
    let best=null,bd=1e9;
    for(const sn of M){
      if(!sn.runs[rn] || !sn.ts) continue;
      if(sn.ts.slice(0,10)!==RACEDATE) continue;        // 必須同一日 ✓
      if(sn.ts > lastS.ts) continue;
      const d=minutesApart(sn.ts,tgt);
      if(d<bd){bd=d;best=sn}
    }
    return (best&&bd<=25)?best:null;                    // 超出 ±25 分鐘 → 未有數據
  };
  const P4=[['WIN','獨贏'],['PLA','位置'],['QIN','連贏'],['QPL','位置Q']];
  const getv=(sn,rn,k,pk)=>{ const r=sn.runs[rn]; if(!r) return null;
    if(pk==='WIN'||pk==='PLA'){ const h=(r.runners||[]).find(x=>x.name===k); const v=h?(pk==='WIN'?h.win:h.place):null; return (v>1.2&&v<900)?v:null; }
    const d=r[pk==='QIN'?'qin':'qpl']||{}; const v=d[k]; return (v>1.2&&v<900)?v:null; };
  const keysOf=(sn,rn,pk)=>{ const r=sn.runs[rn]; if(!r) return [];
    if(pk==='WIN'||pk==='PLA') return (r.runners||[]).map(x=>x.name);
    return Object.keys(r[pk==='QIN'?'qin':'qpl']||{}); };
  const races=realRaces(M);
  let hh='<b>每場落飛王</b> <span class="muted">（開跑前 3h／2h／1h → 對比最新賠率嘅最大跌幅；四個彩池）｜「未到」＝該基準時間仲未到 ✗</span>'
    +'<div style="overflow-x:auto;margin-top:10px"><table style="table-layout:fixed;width:100%">'
    +'<colgroup><col style="width:52px"><col style="width:58px"><col style="width:64px"><col><col><col></colgroup>'
    +'<tr><th>場次</th><th>開跑</th><th>彩池</th><th>前 3 小時</th><th>前 2 小時</th><th>前 1 小時</th></tr>';
  for(const rn of races){
    for(const [pk,pn] of P4){
      const cells=[];
      for(const mins of [180,120,60]){
        const base=near(rn,mins);
        if(!base){cells.push('<td class="muted" style="opacity:.55">未到</td>');continue}
        let bi=null;
        for(const k of keysOf(lastS,rn,pk)){
          const a=getv(base,rn,k,pk), b2=getv(lastS,rn,k,pk);
          if(a==null||b2==null) continue;
          const ch=100*(b2/a-1);
          if(ch<0 && (!bi||ch<bi.ch)) bi={k,ch,a,b:b2};
        }
        cells.push(bi?`<td style="text-align:left"><b>${bi.k}</b> <span class="dn">${bi.ch.toFixed(0)}%</span> <span class="muted">(${bi.a.toFixed(1)}→${bi.b.toFixed(1)})</span></td>`
                      :`<td class="muted">${base?'無跌幅':'未到'}</td>`);
      }
      hh+=`<tr><td><b>R${rn}</b></td><td class="muted">${OFFTIME[rn]||'—'}</td><td class="muted">${pn}</td>${cells.join('')}</tr>`;
    }
  }
  hh+='</table></div><div class="muted" style="margin-top:8px;font-size:12px">'
    +'註① 基準 = 賽日當天、最接近「開跑前 N 小時」嘅快照（容許 ±25 分鐘）；超出範圍顯示「未到」✗<br>'
    +'註② 對比對象 = 最新一張快照（'+((lastS.ts||'').slice(11,16))+'）✓<br>'
    +'註③ 連贏／位置Q 組合名為「號-號」✓</div>';
  rr.innerHTML=hh;
  renderSeries();
  // 已按要求取消：走勢分組
  renderPools();
  renderSlotTop();
  renderDrops();
  renderMatrix();
  renderPairHorse();
  // 已按要求取消：連贏/位置Q 走勢、連贏/位置Q 大幅變動
}
// ── 真實彩池（由 runs 取得）──
// 全域場次同步：改一個下拉 → 所有面板跟隨
function setRace(r){
  SERIES.race=r; SLOT.race=r; PH.race=r;
  try{ renderSeries(); }catch(e){}
  try{ renderMatrix(); }catch(e){}
  try{ renderPairHorse(); }catch(e){}
  try{ renderSlotTop(); }catch(e){}
}
function multiSnaps(){return SNAPS.filter(s=>s.runs&&Object.keys(s.runs).length)}
// 真實場次（排除幻影：馬名組合與其他場次相同）
function realRaces(ms){
  const bad=new Set();
  ms.forEach(s=>{const seen={};
    for(const rn of Object.keys(s.runs)){
      const sig=(s.runs[rn].runners||[]).map(x=>x.name||'').sort().join('|');
      if(seen[sig]){bad.add(rn);} else seen[sig]=rn;
    }});
  return [...new Set(ms.flatMap(s=>Object.keys(s.runs)))].filter(r=>!bad.has(r)).sort((a,b)=>+a-+b);
}
function realPool(race){
  const m=multiSnaps(); if(!m.length) return null;
  const r=m[m.length-1].runs[race]; return (r&&r.pools&&r.pools.WIN)?r.pools.WIN:null;
}
function poolVal(race,p){
  const m=multiSnaps(); if(!m.length) return null;
  const r=m[m.length-1].runs[race]; return (r&&r.pools&&r.pools[p]!=null)?r.pools[p]:null;
}
// ── 💰 彩池總額面板 ──
function renderPools(){
  const box=document.getElementById('pools');
  const ms=multiSnaps();
  if(!ms.length){box.style.display='none';return}
  box.style.display='block';
  const a=ms[0], b=ms[ms.length-1];
  const races=Object.keys(b.runs).sort((x,y)=>+x-+y);
  const g=(race,p)=>{const v1=(a.runs[race]&&a.runs[race].pools||{})[p], v2=(b.runs[race].pools||{})[p];
    if(v1==null||v2==null||!v1) return ''; const ch=100*(v2/v1-1);
    return `<span class="muted" style="font-size:11px"> (${ch>0?'+':''}${ch.toFixed(0)}%)</span>`};
  let h=`<b>💰 彩池總額（真實投注金額）</b> <span class="muted">｜資料來源：${b.hhmm} 快照｜首次 ${a.hhmm}</span>`;
  h+='<div style="overflow-x:auto;margin-top:10px"><table><tr><th>場次</th><th>獨贏</th><th>位置</th><th>連贏</th><th>位置Q</th><th>單T</th><th>單場總額</th><th>所有彩池</th></tr>';
  let tW=0,tA=0;
  for(const rn of races){
    const r=b.runs[rn], pl=r.pools||{}, tt=r.totals||{};
    tW+=pl.WIN||0; tA+=tt.all||0;
    const f=v=>v==null?'<span class="muted">—</span>':'$'+v.toLocaleString();
    h+=`<tr><td>R${rn}</td><td>${f(pl.WIN)}${g(rn,'WIN')}</td><td>${f(pl.PLA)}</td>
        <td>${f(pl.QIN)}</td><td>${f(pl.QPL)}</td><td>${f(pl.TCE)}</td>
        <td>${f(tt.single)}</td><td><b>${f(tt.all)}</b></td></tr>`;
  }
  h+=`<tr style="border-top:2px solid #243453"><td><b>合計</b></td><td><b>$${tW.toLocaleString()}</b></td><td colspan="4"></td><td></td><td><b>$${tA.toLocaleString()}</b></td></tr>`;
  h+='</table></div>';
  h+='<div class="muted" style="margin-top:9px;line-height:1.8">'+
     '<b>實際投注額 = 彩池總額 × 82.5% ÷ 賠率</b>（同注同派）｜括號 = 由首次快照到現在嘅增長<br>'+
     '⚠️ 賽前彩池會由幾萬蚊增長到幾百萬，所以「淨流入」用真實彩池計算最準</div>';
  box.innerHTML=h;
}
// ── 馬號 → 馬名 ──
function nameOf(race,no){
  const ms=multiSnaps(); if(!ms.length) return String(no);
  const r=ms[ms.length-1].runs[race]; if(!r) return String(no);
  const x=(r.runners||[]).find(z=>+z.no===+no); return x?x.name:String(no);
}
// ── ⏰ 時段 Top 10 跌幅（場次 + 彩池 + 時段）──
let SLOT={race:'',pool:'WIN',slot:''};
function slotKeyOf(s){
  if(s.ts){const d=new Date(s.ts); if(!isNaN(d)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':00';}
  return '????-??-?? '+s.hhmm.slice(0,2)+':00';
}
function renderSlotTop(){
  const box=document.getElementById('slottop');
  const ms=multiSnaps(); if(!ms.length){box.style.display='none';return}
  box.style.display='block';

    </div>
    <div id="slotResult" style="margin-top:12px"></div>`;
  box.innerHTML=h;

}
function searchSlotTop(){
  const el=document.getElementById('slotResult'); if(!el) return;
  const ms=multiSnaps(), rn=SLOT.race, pool=SLOT.pool;
  const inSlot=ms.filter(x=>slotKeyOf(x)===SLOT.slot);
  if(!inSlot.length){el.innerHTML='<div class="muted">該時段冇快照</div>';return}
  // 有效值計數器（早期快照有 999 佔位值，會令比較失敗）
  const validCount=(sn)=>{
    const r=sn.runs&&sn.runs[rn]; if(!r) return 0;
    if(pool==='WIN'||pool==='PLA') return (r.runners||[]).filter(x=>{const v=pool==='WIN'?x.win:x.place;return v>1.5&&v<900}).length;
    return Object.values(r[pool==='QIN'?'qin':'qpl']||{}).filter(v=>v>1.5&&v<900).length;
  };
  let end=null, base=null;
  for(let i=inSlot.length-1;i>=0;i--){ if(validCount(inSlot[i])>=6){end=inSlot[i];break} }
  if(!end){const e=ms.indexOf(inSlot[inSlot.length-1]); end=e>=0?ms[e]:inSlot[inSlot.length-1];}
  const eIdx=ms.indexOf(end);
  // 基準：同段內最早有足夠數據嘅快照；冇就往前搵
  for(let i=0;i<inSlot.length;i++){ if(ms.indexOf(inSlot[i])<eIdx && validCount(inSlot[i])>=6){base=inSlot[i];break} }
  if(!base){ for(let i=eIdx-1;i>=0;i--){ if(validCount(ms[i])>=6){base=ms[i];break} } }
  if(!base) base=end;
  if(base===end){el.innerHTML='<div class="muted">該時段只有一張有效快照，冇足夠數據比較</div>';return}
  const get=(s,k)=>{
    const r=s.runs&&s.runs[rn]; if(!r) return null;
    if(pool==='WIN'||pool==='PLA'){
      const nm=(k||'').split('|')[1];
      const x=(r.runners||[]).find(z=>z.name===nm);
      return x?(pool==='WIN'?x.win:x.place):null;
    }
    return (r[pool==='QIN'?'qin':'qpl']||{})[k];
  };
  // 目標清單
  let keys=[];
  const rEnd=end.runs[rn];
  if(pool==='WIN'||pool==='PLA') keys=(rEnd.runners||[]).map(x=>(rn+'|'+x.name));
  else keys=Object.keys(rEnd[pool==='QIN'?'qin':'qpl']||{});
  const rows=[];
  for(const k of keys){
    const a=get(base,k), b=get(end,k);
    if(!a||!b||a<1.5||b<1.5||a>999||b>999) continue;
    const ch=100*(b/a-1);
    if(ch<0) rows.push({k,a,b,ch});
  }
  rows.sort((x,y)=>x.ch-y.ch);
  const top=rows.slice(0,10);
  const poolName={WIN:'獨贏',PLA:'位置',QIN:'連贏',QPL:'位置Q'}[pool];
  const nmOf=k=>{ if(pool==='WIN'||pool==='PLA') return k.split('|')[1];
    const [i,j]=k.split('-'); return i+'-'+j+' <span class="muted">'+nameOf(rn,i)+' × '+nameOf(rn,j)+'</span>'; };
  const fmtT=x=>x.replace(/-/g,'/');
  if(!top.length){el.innerHTML='<div class="muted">該時段冇下跌記錄（快照數：'+inSlot.length+'）</div>';return}
  el.innerHTML=`<div class="muted" style="margin-bottom:8px">時段：<b>${fmtT(SLOT.slot)}</b>　·　${poolName}　·　第 ${rn} 場　·　
      基準 ${base.hhmm.slice(0,2)}:${base.hhmm.slice(2)} → ${end.hhmm.slice(0,2)}:${end.hhmm.slice(2)}（${inSlot.length} 張快照）</div>
    <div style="overflow-x:auto"><table style="table-layout:fixed;width:100%">
      <colgroup><col style="width:44px"><col><col style="width:150px"><col style="width:100px"></colgroup>
      <tr><th>#</th><th>${pool==='WIN'||pool==='PLA'?'馬名':'組合'}</th><th>賠率變化</th><th>跌幅</th></tr>
      ${top.map((x,i)=>`<tr><td class="muted">${i+1}</td><td style="text-align:left"><b>${nmOf(x.k)}</b></td>
        <td>${x.a.toFixed(1)} → <b>${x.b.toFixed(1)}</b></td>
        <td class="dn"><b>${x.ch.toFixed(1)}%</b></td></tr>`).join('')}
    </table></div>`;;
}

let BM={pool:'WIN', after:'', win:90, thr:30, race:''};
function renderDrops(){
  const box=document.getElementById('drops');
  const ms=multiSnaps(); if(ms.length<2){box.style.display='none';return}
  box.style.display='block';
  const WIN=+BM.win||90, THR=+BM.thr||30, poolKey=BM.pool;
  // 時段清單（用 ts，含日期）
  const _p2=n=>String(n).padStart(2,'0');
  const _RD=(ms[ms.length-1].ts||'2026-10-07T00:00:00').slice(0,10);
  const _d0=new Date(_RD+'T12:00:00'); _d0.setDate(_d0.getDate()-1);
  const _D0=_d0.getFullYear()+'-'+_p2(_d0.getMonth()+1)+'-'+_p2(_d0.getDate());
  const slots=[];
  for(let h=12;h<=23;h++) slots.push({key:_D0+'T'+_p2(h), label:_D0.slice(5).replace('-','/')+' '+_p2(h)+':00'});
  for(let h=0;h<=23;h++)  slots.push({key:_RD+'T'+_p2(h), label:_RD.slice(5).replace('-','/')+' '+_p2(h)+':00'});
  if(!BM.after) BM.after=slots[0].key;
  const allRaces=realRaces(ms);
  const races=(BM.race && allRaces.includes(BM.race))?[BM.race]:allRaces;
  const lastS=ms[ms.length-1];
  const valOf=(sn,rn,k)=>{ const r=sn.runs[rn]; if(!r) return null;
    if(poolKey==='WIN'||poolKey==='PLA'){ const h=(r.runners||[]).find(x=>x.name===k);
      const v=h?(poolKey==='WIN'?h.win:h.place):null; return (v>1.2&&v<900)?v:null; }
    const d=r[poolKey==='QIN'?'qin':'qpl']||{}; const v=d[k]; return (v>1.2&&v<900)?v:null; };
  const keysOf=(sn,rn)=>{ const r=sn.runs[rn]; if(!r) return [];
    if(poolKey==='WIN'||poolKey==='PLA') return (r.runners||[]).map(x=>x.name);
    return Object.keys(r[poolKey==='QIN'?'qin':'qpl']||{}); };
  // 每場每標的嘅時間序列
  const series=[];   // {rn,k,t0,v0}
  for(const rn of races){
    for(const k of keysOf(lastS,rn)){
      const s=[]; for(const sn of ms){ if(sn.ts.slice(0,13)<BM.after) continue;
        const v=valOf(sn,rn,k); if(v!=null) s.push([sn.ts,v]); }
      if(s.length>=2) series.push({rn,k,s});
    }
  }
  const ev=[];
  for(const {rn,k,s} of series){
    for(let i=0;i<s.length;i++){
      for(let j=i+1;j<s.length;j++){
        const dt=(new Date(s[j][0])-new Date(s[i][0]))/60000;
        if(dt>WIN) break;
        const ch=100*(s[j][1]/s[i][1]-1);
        if(ch<=-THR) ev.push({rn,k,ch,a:s[i][1],b:s[j][1],t0:s[i][0],t1:s[j][0],mins:Math.round(dt)});
      }
    }
  }
  // 去重：同一場 + 同一標的 + 同一「起點」→ 只保留最大跌幅（避免同一事件重複 ✗）
  const seenKey={};
  for(const e of ev){
    const kk=e.rn+'|'+e.k+'|'+e.t0;
    if(!seenKey[kk] || e.ch<seenKey[kk].ch) seenKey[kk]=e;
  }
  ev.length=0; for(const kk in seenKey) ev.push(seenKey[kk]);
  ev.sort((x,y)=>x.ch-y.ch);
  const poolName={WIN:'獨贏',PLA:'位置',QIN:'連贏',QPL:'位置Q'}[poolKey];
  const numOf=(rn,nm2)=>{ const r=lastS.runs[rn]; if(!r) return ''; const h=(r.runners||[]).find(x=>x.name===nm2); return h&&h.no!=null?String(h.no):''; };
  const nm=(rn,k)=>{ if(poolKey==='WIN'||poolKey==='PLA') return numOf(rn,k)+' '+k;
    const p2=k.split('-'); const f=n=>nameOf(rn,n)||n;
    return k+'（'+f(p2[0])+' × '+f(p2[1])+'）'; };
  const sel=(id,opts,val,lab)=>`<div><label style="display:block;font-size:12px;color:#93a7c9;margin-bottom:4px">${lab}</label>
    <select onchange="BM.${id}=this.value;renderDrops()" style="background:#0e1830;color:#e8eefc;border:1px solid #243453;border-radius:8px;padding:7px 10px;font-size:13.5px">
    ${opts.map(o=>`<option value="${o.v}" ${String(o.v)===String(val)?'selected':''}>${o.l}</option>`).join('')}</select></div>`;
  const hhmm=st=>st.slice(11,16), dd=st=>st.slice(5,10).replace('-','/');
  let h=`<b>🔎 大幅變動警示</b> <span class="muted">（全部場次；窗口內任意時點；同一標的可多次 ✓）</span>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      ${sel('pool',[{v:'WIN',l:'獨贏'},{v:'PLA',l:'位置'},{v:'QIN',l:'連贏'},{v:'QPL',l:'位置Q'}],BM.pool,'① 彩池')}
      ${sel('after',slots.map(t=>({v:t.key,l:t.label})),BM.after,'② 幾點以後')}
      ${sel('win',[15,30,45,60,90,120].map(m=>({v:m,l:m+' 分鐘'})),BM.win,'③ 時間段（窗口內任意時點）')}
      ${sel('thr',[...Array(30)].map((_,i)=>({v:i+1,l:'≥ '+(i+1)+'%'})).concat([{v:31,l:'≥ 30% 以上'}]),BM.thr,'④ 賠率跌幅')}
      ${sel('race',[{v:'',l:'全部場次'}].concat(allRaces.map(r=>({v:r,l:'第 '+r+' 場'}))),BM.race,'⑤ 場次')}
    </div>
    <div style="margin-top:10px;font-size:12.5px;color:#93a7c9">邏輯：由 <b>${(slots.find(x=>x.key===BM.after)||{label:BM.after}).label}</b> 到最新，任何 <b>${WIN} 分鐘內</b>出現 ≥ ${THR>30?'30%+':THR+'%'} 跌幅 → 全部列出 ✓（${BM.race?'第 '+BM.race+' 場':'全部場次'}）</div>`;
  if(!ev.length){ h+='<div class="muted" style="margin-top:10px">冇符合紀錄（可放寬跌幅或延長窗口）</div>'; box.innerHTML=h; return; }
  h+=`<div class="muted" style="margin-top:8px">符合紀錄：<b>${ev.length}</b> 條（顯示前 100 條，按跌幅排序）</div>`;
  h+='<div style="overflow-x:auto;margin-top:8px"><table style="table-layout:fixed;width:100%">'
   +'<colgroup><col style="width:40px"><col style="width:48px"><col><col style="width:96px"><col style="width:96px"><col style="width:170px"><col style="width:76px"></colgroup>'
   +'<tr><th>#</th><th>場次</th><th>標的</th><th>起點</th><th>終點</th><th>時間段</th><th>跌幅</th></tr>';
  ev.slice(0,100).forEach((x,i)=>{
    h+=`<tr><td class="muted">${i+1}</td><td><b>R${x.rn}</b></td>
      <td style="text-align:left"><b>${nm(x.rn,x.k)}</b></td>
      <td>${dd(x.t0)} ${hhmm(x.t0)}<br><b>${x.a.toFixed(1)}</b></td>
      <td>${dd(x.t1)} ${hhmm(x.t1)}<br><b>${x.b.toFixed(1)}</b></td>

      <td class="dn"><b>${x.ch.toFixed(1)}%</b></td></tr>`;
  });
  h+='</table></div><div class="muted" style="margin-top:8px;font-size:12px">註：只計有報價嘅時點；同一組合可能因唔同時段而出現多次 ✓</div>';
  box.innerHTML=h;
}

    h+='</table></div>';

  let any=false;

    let bi=-1, baseS=null, v0=null;

      if(v>1.5&&v<900){bi=i;baseS=valid[i];v0=v;break}}
    const v1=(lastS.runs[rn][pk]||{})[k];
    if(!baseS||!v1||v1<=1.5||v1>=900) continue; any=true;
    const r=v1/v0;
    const hist=valid.map(x=>((x.runs[rn][pk]||{})[k])).filter(v=>v>1.5&&v<900);
    const sh1=shareOf(lastS,k), amt=(p1&&sh1)?p1*0.825*sh1:null;
    const sh0=shareOf(baseS,k);
    const net=(p1&&sh1&&sh0)?p1*0.825*(sh1-sh0):null;
    const p0=poolOf(baseS);
    const spark=(arr)=>{ if(!arr||arr.length<2) return '';
      const mn=Math.min(...arr),mx=Math.max(...arr),W=90,Hh=22,kk=arr.length;
      const pts=arr.map((v,t)=>{const px=kk>1?t/(kk-1)*W:0;const py=mx>mn?Hh-(v-mn)/(mx-mn)*Hh:Hh/2;return px.toFixed(1)+','+py.toFixed(1)}).join(' ');
      return `<svg width="${W}" height="${Hh}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${arr[arr.length-1]<arr[0]?'#8ff0c8':'#ff8f7a'}" stroke-width="1.5"/></svg>`};
    const [i2,j2]=k.split('-');
    html+=`<tr><td><b>${k}</b></td><td class="muted">${nameOf(rn,i2)} × ${nameOf(rn,j2)}</td>`;
    let prev=v0;

      const si=times.indexOf(tsel[t]); const v=(valid[si].runs[rn][pk]||{})[k];
      if(!v){html+='<td class="muted">—</td>';continue}
      html+=`<td class="${v<prev?'dn':(v>prev?'up':'')}">${v.toFixed(v<10?1:0)}</td>`; prev=v;
    }

      <td>${amt?formatMoney(amt):'—'}</td>

  el.innerHTML=`<div class="muted" style="margin-bottom:8px">${pool==='qin'?'連贏':'位置Q'} 第 ${rn} 場 · 馬號 ${me} ${nameOf(rn,me)} · ${valid.length} 張快照
    ${p1?'· 連贏彩池 $'+Math.round(p1).toLocaleString():''}</div>`+html;

  const finalPool=(()=>{const z=valid[valid.length-1].runs[rn];return z&&z.pools?z.pools.WIN:null})();
  let baseIdx=0;
  if(finalPool) for(let i=0;i<valid.length;i++){const pp=(valid[i].runs[rn]||{}).pools;
    if(pp&&pp.WIN&&pp.WIN>=finalPool*0.4){baseIdx=i;break}}
  const first=valid[baseIdx], last=valid[valid.length-1];
  const toMin=h=>Math.floor(+h/100)*60+(+h%100);
  // 為每個標的搵「全期最大 30 分鐘跌幅窗口」
  const bestDrop=(hist,times)=>{
    let best=null;
    for(let i=0;i<hist.length;i++){
      for(let j=i+1;j<hist.length;j++){
        const dt=toMin(times[j])-toMin(times[i]);
        if(dt<=0||dt>35) continue;
        const a=hist[i], b=hist[j];
        if(!a||!b||a<1.5||b<1.5) continue;

      }

    return best;
  };
  const build=pool=>{
    const o2=last.runs[rn][pool]||{};

      const times=valid.map(x=>x.hhmm);
      const a=hist.find(v=>v!=null), b=hist[hist.length-1];
      if(!a||!b||a<1.5||b<1.5) continue;
      const bd=bestDrop(hist,times);
      const lo=Math.min(...hist.filter(v=>v!=null)), hi=Math.max(...hist.filter(v=>v!=null));

      '<th>相對市場<br><span style="font-weight:400;font-size:10.5px">(扣除大市)</span></th>'+
      '<th>區間（最低-最高）</th><th>走勢</th></tr>';
    for(const x of show){
      const [i,j]=x.k.split('-');
      const cls=x.r<1?'dn':'up';
      const scls=(x.sr!=null)?(x.sr<1?'dn':'up'):'';
      const spark=(arr)=>{ if(!arr||arr.length<2) return '';
        const mn=Math.min(...arr),mx=Math.max(...arr),W=90,Hh=22,kk=arr.length;
        const pts=arr.map((v,t)=>{const px=kk>1?t/(kk-1)*W:0;const py=mx>mn?Hh-(v-mn)/(mx-mn)*Hh:Hh/2;return px.toFixed(1)+','+py.toFixed(1)}).join(' ');
        const col=arr[arr.length-1]<arr[0]?'#8ff0c8':'#ff8f7a';
        return `<svg width="${W}" height="${Hh}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`};
      h+=`<tr><td><b>${i}-${j}</b></td><td>${nameOf(rn,i)} × ${nameOf(rn,j)}</td>
          <td>${x.a.toFixed(1)}</td><td><b>${x.b.toFixed(1)}</b></td>
          <td class="${cls}"><b>${x.r<1?'':'+'}${(100*(x.r-1)).toFixed(0)}%</b></td>
          <td class="dn"><b>${x.bd?(100*x.bd.ch).toFixed(0)+'%':'—'}</b></td>
          <td class="muted" style="font-size:11.5px">${x.bd?(x.bd.t1.slice(0,2)+':'+x.bd.t1.slice(2)+' → '+x.bd.t2.slice(0,2)+':'+x.bd.t2.slice(2)+'（'+x.bd.from.toFixed(1)+'→'+x.bd.to.toFixed(1)+'）'):'—'}</td>
          <td class="muted" style="font-size:11.5px">${x.lo!=null?x.lo.toFixed(0)+' - '+x.hi.toFixed(0):'—'}</td>
          <td>${spark(x.hist)}</td></tr>`;
    }
    h+='</table></div>';
    return h;
  };
  box.innerHTML=`<b>📈 連贏／位置Q 賠率走勢</b> <span class="muted">（第 ${rn} 場｜落飛最多 8 組＋退飛最多 8 組）</span>`+

let PCTILE=99, MINAMT=50000;
function allMoves(){          // 收集所有相鄰快照嘅彩池佔比變化
  const ms=SNAPS.filter(x=>x.runs&&Object.keys(x.runs).length), out=[];
  const toMin=h=>Math.floor(+h/100)*60+(+h%100);
  for(let i=1;i<ms.length;i++){
    const A=ms[i-1],B=ms[i]; const dt=toMin(B.hhmm)-toMin(A.hhmm);
    if(dt<=0||dt>20) continue;
    for(const rn in B.runs){
      const ra=A.runs[rn]; if(!ra) continue;
      const k1={},k2={};
      (ra.runners||[]).forEach(x=>{if(x.win>1.2)k1[x.name]=x.win});
      (B.runs[rn].runners||[]).forEach(x=>{if(x.win>1.2)k2[x.name]=x.win});
      const ks=Object.keys(k1).filter(k=>k2[k]);
      if(ks.length<5) continue;
      const t0=ks.reduce((s,k)=>s+1/k1[k],0), t1=ks.reduce((s,k)=>s+1/k2[k],0);
      for(const k of ks) out.push({rn,d:100*((1/k2[k])/t1-(1/k1[k])/t0)});
    }
  }
  return out;
}
function adaptThreshold(){
  const mv=allMoves(); if(mv.length<20) return {pct:8, n:mv.length, fallback:true};
  const d=mv.map(x=>Math.abs(x.d)).sort((a,b)=>a-b);
  const v=d[Math.min(d.length-1,Math.floor(d.length*PCTILE/100))];
  return {pct:Math.max(1,v), n:mv.length, fallback:false};
}

     '<b>真正訊號 = 流入</b>（新資金方向）；流出只反映相對變化<br>* = 用估算彩池（該場未有真實彩池數據）</div>';

  const rows=Object.keys(horses).map(k=>{
    const h=horses[k]; const idx=Object.keys(h).map(Number).sort((a,b)=>a-b);
    const first=h[idx[0]], last=h[idx[idx.length-1]];
    const _nm2=k.split('|')[1];
    const _r=(multiSnaps().find(x=>x.runs&&x.runs[SERIES.race])||{runs:{}}).runs[SERIES.race];
    const _h=(_r&&_r.runners||[]).find(y=>y.name===_nm2);
    return {k,no:(_h&&_h.no!=null)?String(_h.no):'—',nm:_nm2,h,idx,first,last,r:last/first};
  }).sort((a,b)=>a.r-b.r);
  const spark=(h,idx)=>{
    const vals=idx.map(i=>h[i]); const mn=Math.min(...vals),mx=Math.max(...vals);
    const W=110,H=26,n=vals.length;
    const pts=vals.map((v,i)=>{const x=n>1?i/(n-1)*W:0;const y=mx>mn?H-(v-mn)/(mx-mn)*H:H/2;return `${x.toFixed(1)},${y.toFixed(1)}`}).join(' ');
    const col=vals[n-1]<vals[0]?'#8ff0c8':'#ff8f7a';
    return `<svg width="${W}" height="${H}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"/></svg>`;
  };
  const realW=realPool(SERIES.race);
  const POOL=realW||(parseFloat(document.getElementById('pool').value||'10'))*1e6;
  const sel=`<select id="raceSel" onchange="setRace(this.value)" style="background:#0e1830;color:#e8eefc;border:1px solid #243453;border-radius:8px;padding:6px 10px">
    ${races.map(r=>`<option value="${r}" ${r===SERIES.race?'selected':''}>第 ${r} 場</option>`).join('')}</select>`;
  let h='<b>每匹馬賠率走勢</b> '+sel+
    ` <span class="muted" style="margin-left:8px">${rows.length} 匹｜${snaps.length} 個快照（顯示 ${tsel.length} 個時間點）</span>`;
  h+='<div style="overflow-x:auto;margin-top:10px"><table><tr><th>馬號</th><th>馬名</th><th>開盤</th>'+
     tsel.slice(1,-1).map(t=>`<th>${t.slice(0,2)}:${t.slice(2)}</th>`).join('')+
     '<th>最新</th><th>變幅</th><th>實際投注額</th><th>淨流入</th><th>走勢</th></tr>';
  for(const x of rows){
    // 估算投注額（同注同派：金額 = 彩池 × 0.825 ÷ 賠率，再按場內歸一）
    const share0=(1/x.first)/rows.reduce((t,y)=>t+1/y.first,0);
    const share1=(1/x.last)/rows.reduce((t,y)=>t+1/y.last,0);
    const amt0=POOL*0.825*share0, amt1=POOL*0.825*share1, net=amt1-amt0;
    x._net=net; x._amt=amt1;
    h+=`<tr><td><b>${x.no!=null?x.no:'—'}</b></td><td><b>${x.nm}</b></td><td>${fmt(x.first)}</td>`;
    let prev=x.first;
    for(let i=1;i<tsel.length-1;i++){
      const si=times.indexOf(tsel[i]); const v=x.h[si];
      if(v==null){h+='<td class="muted">—</td>';continue}
      const cls=v<prev?'dn':(v>prev?'up':'');
      h+=`<td class="${cls}">${fmt(v)}</td>`; prev=v;
    }
    const cls=x.r<1?'dn':'up';
    const ncls=net>0?'dn':(net<0?'up':'');
    const big=Math.abs(net)>POOL*0.05?' style="font-weight:700"':'';
    h+=`<td><b>${fmt(x.last)}</b></td><td class="${cls}"><b>${x.r<1?'':'+'}${(100*(x.r-1)).toFixed(0)}%</b></td>
        <td${big}>${formatMoney(x._amt)}</td>
        <td class="${ncls}"${big}>${net>0?'+':''}${formatMoney(net)}</td>
        <td>${spark(x.h,x.idx)}</td></tr>`;
  }
  h+='</table></div>';
  h+=`<div class="muted" style="margin-top:9px;line-height:1.8">`+
     (realW?`彩池：<b>真實 $${realW.toLocaleString()}</b>（HKJC 公佈）｜`:`彩池：估算 $${(POOL/1e6).toFixed(1)}M（手動輸入）｜`)+
     '綠字 = 賠率下跌（落飛）｜紅字 = 賠率上升（退飛）｜按「變幅」排序<br>'+
     '<b>實際投注額</b>：同注同派機制下，金額 = 彩池 × 82.5% ÷ 賠率（場內歸一）<br>'+
     '<b>淨流入</b>：由第一個快照到最新嘅差額（正數 = 新資金流入該馬）｜粗體 = 超過彩池 5%</div>';
  box.innerHTML=h;
}
